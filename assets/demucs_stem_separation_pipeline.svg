<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Demucs Stem Separation Pipeline</title>
  <desc id="desc">A presentation diagram explaining how MoodWave uses Hybrid Transformer Demucs to separate a mixed song into vocals, drums, bass, guitar, piano, and other stems.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#fbfcff"/>
      <stop offset="1" stop-color="#f5f7fb"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c6bfa"/>
      <stop offset="1" stop-color="#4ecdc4"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb33f"/>
      <stop offset="1" stop-color="#ff6b8a"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6b8cfa"/>
      <stop offset="1" stop-color="#4ecdc4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#64748b" flood-opacity="0.18"/>
    </filter>
    <marker id="arrow" markerWidth="16" markerHeight="16" refX="13" refY="8" orient="auto">
      <path d="M2,2 L14,8 L2,14 Z" fill="#334155"/>
    </marker>
    <style>
      .title { font: 700 44px 'Segoe UI', Arial, sans-serif; fill: #111827; letter-spacing: 0.02em; }
      .subtitle { font: 400 22px 'Segoe UI', Arial, sans-serif; fill: #475569; }
      .label { font: 700 25px 'Segoe UI', Arial, sans-serif; fill: #182033; }
      .small { font: 400 18px 'Segoe UI', Arial, sans-serif; fill: #475569; }
      .mono { font: 600 17px 'Cascadia Mono', 'Consolas', monospace; fill: #26334d; }
      .tiny { font: 500 14px 'Segoe UI', Arial, sans-serif; fill: #64748b; }
      .box { fill: #ffffff; stroke: #d8dee9; stroke-width: 2; rx: 20; filter: url(#shadow); }
      .soft { fill: #f7f9fd; stroke: #d8dee9; stroke-width: 1.5; rx: 18; }
      .line { stroke: #334155; stroke-width: 4; fill: none; marker-end: url(#arrow); opacity: 0.9; }
      .thin { stroke: #94a3b8; stroke-width: 2; fill: none; opacity: 0.75; stroke-linecap: round; }
      .wave { stroke: #4ecdc4; stroke-width: 4; fill: none; stroke-linecap: round; }
      .stemText { font: 700 18px 'Segoe UI', Arial, sans-serif; fill: #111827; }
      .stemSub { font: 500 13px 'Segoe UI', Arial, sans-serif; fill: #64748b; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <text x="80" y="85" class="title">How Demucs Separates Music Stems</text>
  <text x="82" y="122" class="subtitle">MoodWave uses Hybrid Transformer Demucs 6-source separation before TouchDesigner visualization</text>

  <!-- Input -->
  <rect x="70" y="260" width="225" height="230" class="box"/>
  <text x="105" y="305" class="label">Mixed Song</text>
  <text x="105" y="338" class="small">one audio file</text>
  <text x="105" y="364" class="mono">current.wav</text>
  <path d="M105 425 C125 365, 145 485, 165 425 S205 365, 225 425 S265 485, 280 425" class="wave"/>

  <!-- Preprocess -->
  <line x1="295" y1="375" x2="390" y2="375" class="line"/>
  <rect x="390" y="255" width="250" height="240" class="box"/>
  <text x="430" y="305" class="label">Preprocess</text>
  <text x="430" y="342" class="small">load audio</text>
  <text x="430" y="370" class="small">resample / normalize</text>
  <text x="430" y="398" class="small">stereo tensor</text>
  <text x="430" y="438" class="mono">(1, 2, samples)</text>
  <text x="410" y="466" class="tiny">split inference lowers memory use</text>

  <!-- Demucs core -->
  <line x1="640" y1="375" x2="740" y2="375" class="line"/>
  <rect x="740" y="185" width="500" height="380" class="box"/>
  <rect x="770" y="220" width="440" height="310" rx="22" fill="#fbfdff" stroke="url(#core)" stroke-width="3"/>
  <text x="795" y="265" class="label">Hybrid Transformer Demucs</text>
  <text x="795" y="297" class="small">learns to estimate each source from the mixture</text>

  <rect x="805" y="335" width="170" height="105" class="soft"/>
  <text x="835" y="368" class="small">Waveform</text>
  <text x="835" y="394" class="small">U-Net path</text>
  <path d="M832 420 C850 400, 868 440, 886 420 S922 400, 940 420" class="wave" opacity="0.85"/>

  <rect x="1005" y="335" width="170" height="105" class="soft"/>
  <text x="1036" y="368" class="small">Spectrogram</text>
  <text x="1036" y="394" class="small">U-Net path</text>
  <rect x="1035" y="410" width="110" height="6" fill="#ffb33f" opacity="0.9"/>
  <rect x="1035" y="421" width="90" height="6" fill="#ff6b8a" opacity="0.75"/>
  <rect x="1035" y="432" width="120" height="6" fill="#4ecdc4" opacity="0.65"/>

  <line x1="890" y1="335" x2="890" y2="315" class="thin"/>
  <line x1="1090" y1="335" x2="1090" y2="315" class="thin"/>
  <rect x="842" y="462" width="296" height="52" rx="17" fill="url(#core)" opacity="0.94"/>
  <text x="870" y="495" class="mono">cross-domain Transformer</text>
  <path d="M977 386 C987 377, 995 377, 1005 386" class="thin"/>
  <path d="M977 406 C987 415, 995 415, 1005 406" class="thin"/>
  <text x="775" y="555" class="tiny">self-attention inside each domain + cross-attention between domains</text>

  <!-- Output -->
  <line x1="1240" y1="375" x2="1310" y2="375" class="line"/>
  <rect x="1310" y="190" width="220" height="370" class="box"/>
  <text x="1350" y="235" class="label">Separated</text>
  <text x="1350" y="266" class="label">Stems</text>

  <g transform="translate(1340 302)">
    <rect width="160" height="34" rx="10" fill="#ff6b8a" opacity="0.9"/>
    <text x="15" y="23" class="stemText">vocals.wav</text>
    <rect y="43" width="160" height="34" rx="10" fill="#f5a623" opacity="0.9"/>
    <text x="15" y="66" class="stemText">drums.wav</text>
    <rect y="86" width="160" height="34" rx="10" fill="#6b8cfa" opacity="0.9"/>
    <text x="15" y="109" class="stemText">bass.wav</text>
    <rect y="129" width="160" height="34" rx="10" fill="#ffb33f" opacity="0.9"/>
    <text x="15" y="152" class="stemText">guitar.wav</text>
    <rect y="172" width="160" height="34" rx="10" fill="#8c7cff" opacity="0.9"/>
    <text x="15" y="195" class="stemText">piano.wav</text>
    <rect y="215" width="160" height="34" rx="10" fill="#4ecdc4" opacity="0.9"/>
    <text x="15" y="238" class="stemText">other.wav</text>
  </g>

  <!-- MoodWave use -->
  <rect x="188" y="675" width="1224" height="120" rx="26" fill="#f8fafc" stroke="#d8dee9" stroke-width="2"/>
  <text x="226" y="724" class="label">In MoodWave</text>
  <text x="226" y="760" class="small">Demucs gives instrument-level control signals:</text>
  <text x="625" y="760" class="mono">vocals -> flower breath</text>
  <text x="895" y="760" class="mono">drums -> bursts</text>
  <text x="1112" y="760" class="mono">bass -> glow / scale</text>
  <text x="226" y="785" class="tiny">The MuQ-BiGRU model controls mood/color, while Demucs stems control motion/reactivity.</text>

</svg>
